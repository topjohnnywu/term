<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloud IDE Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 1.5rem;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      background: #238636;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.2rem;
    }
    .badge.offline {
      background: #da3633;
    }
    .spinner {
      border: 4px solid #21262d;
      border-top: 4px solid #2f81f7;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f0f6fc; font-weight: 600; }
    p { font-size: 0.95rem; color: #8b949e; margin-bottom: 1.5rem; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: #238636;
      color: #ffffff;
      text-decoration: none;
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #2ea043; }
    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      margin-left: 0.5rem;
    }
    .btn-secondary:hover { background: #30363d; }
    #action-area { display: none; margin-top: 1rem; }
    #ide-frame {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
    }
    #controls {
      display: none;
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 9999;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 4px 8px;
      gap: 6px;
      align-items: center;
    }
    #controls a, #controls button {
      background: transparent;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 12px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #controls a:hover, #controls button:hover {
      color: #f0f6fc;
      background: #30363d;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="card">
      <div id="badge" class="badge">SECURE GATEWAY</div>
      <div id="spinner" class="spinner"></div>
      <h1 id="title">Connecting to Code Server</h1>
      <p id="status">Resolving active tunnel session...</p>
      <div id="action-area">
        <a id="retry-btn" href="javascript:location.reload()" class="btn">Retry</a>
        <a href="index.html" class="btn btn-secondary">Open Terminal</a>
      </div>
    </div>
  </div>

  <iframe id="ide-frame" allow="clipboard-read; clipboard-write"></iframe>

  <div id="controls">
    <button onclick="reloadFrame()" title="Reload IDE">↻ Reload</button>
    <a id="popout-link" href="#" target="_blank" title="Open directly in new tab">↗ Popout</a>
    <a href="index.html" title="Switch to Terminal">Terminal</a>
    <a href="wa.html" title="Switch to WhatsApp">WhatsApp</a>
  </div>

  <script>
    const GIST_ID = "b491ad614bb910c7689650f63f4c9fcb";
    let activeUrl = null;

    function reloadFrame() {
      const frame = document.getElementById("ide-frame");
      if (activeUrl) {
        frame.src = activeUrl;
      } else {
        location.reload();
      }
    }

    async function init() {
      const statusEl = document.getElementById("status");
      const titleEl = document.getElementById("title");
      const badgeEl = document.getElementById("badge");
      const actionEl = document.getElementById("action-area");
      const spinner = document.getElementById("spinner");
      const frame = document.getElementById("ide-frame");
      const loader = document.getElementById("loader");
      const controls = document.getElementById("controls");
      const popoutLink = document.getElementById("popout-link");

      try {
        const res = await fetch("https://api.github.com/gists/" + GIST_ID + "?nocache=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const url = (data.files && data.files["ide_tunnel.txt"]) ? data.files["ide_tunnel.txt"].content.trim() : null;

        if (!url || !url.startsWith("http")) {
          badgeEl.className = "badge offline";
          badgeEl.innerText = "ACCESS DISABLED";
          titleEl.innerText = "Code Server Offline";
          statusEl.innerText = 'Run "./start-ide" in Termux on your Android device to unlock access.';
          spinner.style.display = "none";
          actionEl.style.display = "block";
          return;
        }

        // Redirect top-level window directly so cookies, auth, and clipboard work seamlessly
        window.location.replace(url);
        return;

      } catch (err) {
        badgeEl.className = "badge offline";
        badgeEl.innerText = "ERROR";
        titleEl.innerText = "Connection Failed";
        statusEl.innerText = "Error resolving session: " + err.message;
        spinner.style.display = "none";
        actionEl.style.display = "block";
      }
    }
    init();
  </script>
</body>
</html>
