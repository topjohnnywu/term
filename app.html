<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DO Insight System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      background: #238636;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.2rem;
    }
    .spinner {
      border: 4px solid #21262d;
      border-top: 4px solid #2f81f7;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f0f6fc; font-weight: 600; }
    p { font-size: 0.95rem; color: #8b949e; margin-bottom: 1.5rem; line-height: 1.5; word-break: break-word; }
    .btn {
      display: inline-block;
      background: #238636;
      color: #fff;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #2ea043; }
    .footer {
      margin-top: 2rem;
      padding-top: 1.2rem;
      border-top: 1px solid #21262d;
      font-size: 0.85rem;
      color: #6e7681;
    }
    .footer a {
      color: #58a6ff;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">DO Insight System v5</div>
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Connecting to System...</h1>
    <p id="status">Resolving active Cloudflare session...</p>
    <div id="action-area" style="display:none;">
      <a id="manual-link" class="btn" href="#">Open DO Insight System</a>
    </div>
    <div class="footer">
      Looking for terminal? <a href="https://topjohnnywu.github.io/term/">Go to Web Terminal</a>
    </div>
  </div>

  <script>
    const GIST_ID = "9b4f25e801a2358e9357661b08a2f9ee";
    async function init() {
      const statusEl = document.getElementById("status");
      const titleEl = document.getElementById("title");
      const actionEl = document.getElementById("action-area");
      const manualLink = document.getElementById("manual-link");
      const spinner = document.getElementById("spinner");

      try {
        const res = await fetch("https://api.github.com/gists/" + GIST_ID + "?nocache=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const url = (data.files && data.files["app_tunnel.txt"]) ? data.files["app_tunnel.txt"].content.trim() : null;

        if (!url || !url.startsWith("http")) {
          titleEl.innerText = "System Offline";
          statusEl.innerText = "DO Insight System is currently offline. Please run \"run app server\" on your Android device to start it.";
          spinner.style.display = "none";
          return;
        }

        statusEl.innerHTML = "Redirecting to active session:<br><small style=\"color:#58a6ff;\">" + url + "</small>";
        manualLink.href = url;
        actionEl.style.display = "block";

        // Auto-redirect to DO Insight System
        window.location.replace(url);
      } catch (err) {
        titleEl.innerText = "Connection Failed";
        statusEl.innerText = "Error resolving session: " + err.message;
        spinner.style.display = "none";
      }
    }
    init();
  </script>
</body>
</html>
