<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Termux Web Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 1.5rem;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .spinner {
      border: 4px solid #21262d;
      border-top: 4px solid #58a6ff;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f0f6fc; }
    p { font-size: 0.95rem; color: #8b949e; margin-bottom: 1.5rem; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: #238636;
      color: #fff;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #2ea043; }
    #term-frame {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    .control-pill {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 4px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #8b949e;
      transition: opacity 0.2s;
      opacity: 0.4;
    }
    .control-pill:hover {
      opacity: 1;
    }
    .control-pill button {
      color: #58a6ff;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .control-pill button:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <h1 id="title">Connecting to Terminal...</h1>
      <p id="status">Connecting to active Cloudflare session...</p>
      <div id="action-area" style="display:none;">
        <button class="btn" onclick="location.reload()">Retry Connection</button>
      </div>
      <div style="margin-top: 1.5rem; font-size: 0.85rem; color: #6e7681;">
        Looking for app? <a href="https://topjohnnywu.github.io/app/" style="color:#58a6ff; text-decoration:none;">Go to DO Insight System</a>
      </div>
    </div>
  </div>

  <iframe id="term-frame" allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <div class="control-pill" id="controls" style="display:none;">
    <button onclick="reloadFrame()" title="Reload Session">⟳ Reload</button>
  </div>

  <script>
    const GIST_ID = '9b4f25e801a2358e9357661b08a2f9ee';
    let activeUrl = null;

    function reloadFrame() {
      const frame = document.getElementById('term-frame');
      if (activeUrl) {
        frame.src = activeUrl + "?t=" + Date.now();
      } else {
        location.reload();
      }
    }

    async function init() {
      const statusEl = document.getElementById('status');
      const titleEl = document.getElementById('title');
      const actionEl = document.getElementById('action-area');
      const spinner = document.getElementById('spinner');
      const frame = document.getElementById('term-frame');
      const loader = document.getElementById('loader');
      const controls = document.getElementById('controls');

      try {
        const res = await fetch('https://api.github.com/gists/' + GIST_ID + '?nocache=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const url = (data.files && data.files['tunnel.txt']) ? data.files['tunnel.txt'].content.trim() : null;

        if (!url || !url.startsWith('http')) {
          titleEl.innerText = 'Terminal Offline';
          statusEl.innerText = 'Terminal server is currently offline. Please run "run terminal server" on Android.';
          spinner.style.display = 'none';
          actionEl.style.display = 'block';
          return;
        }

        activeUrl = url;
        frame.src = url;

        frame.onload = () => {
          loader.style.display = 'none';
          frame.style.display = 'block';
          controls.style.display = 'flex';
        };

        // Fallback in case onload is suppressed across origins
        setTimeout(() => {
          loader.style.display = 'none';
          frame.style.display = 'block';
          controls.style.display = 'flex';
        }, 1200);

      } catch (err) {
        titleEl.innerText = 'Connection Failed';
        statusEl.innerText = 'Error fetching session: ' + err.message;
        spinner.style.display = 'none';
        actionEl.style.display = 'block';
      }
    }
    init();
  </script>
</body>
</html>
